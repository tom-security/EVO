# Entraînements et contrôles d'EVO sur les runners GitHub (Linux, 4 vCPU).
# Lancement depuis le PC (le fichier doit être sur main pour que workflow_dispatch apparaisse) :
#   gh workflow run train.yml --ref main -f mode=reproductibilite
#   gh workflow run train.yml --ref <branche> -f mode=pytest [-f source_run_id=<id d'un run train>]
#   gh workflow run train.yml --ref <branche> -f mode=train -f run_name=essai -f generations=5
#   gh workflow run train.yml --ref <branche> -f mode=analyse -f source_run_id=<id d'un run train> \
#       -f commandes="joints --seed 2 --gen 200 --crossings --export out/c1 ; replay --seed 2 --gen 200 --export out/r2"
#   gh run watch <id> ; gh run download <id> -D artefacts/
# Environnement figé pendant tout le chantier : ubuntu-24.04, Python 3.11 et les versions des runs de
# référence (PASSATION §3.1) : numpy 2.4.6, numba 0.67.0, pygame 2.6.1.
# Les rejeux ne sont identiques au bit près que sur ce runner (pas sous Windows) : tout ce qui rejoue ou mesure
# un run entraîné passe par le mode analyse.

name: train

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "train ; reproductibilite (rejeu des champions B2) ; pytest ; analyse (mesures et écrans)"
        type: choice
        options: [train, reproductibilite, pytest, analyse]
        default: train
      source_run_id:
        description: "analyse, pytest : identifiant d'un run train dont on récupère les archives (vide : runs B2 seuls)"
        type: string
        default: ""
      source_run_id_2:
        description: "analyse, pytest : second run train (facultatif, ex. runs à 6° et à 30°)"
        type: string
        default: ""
      commandes:
        description: "analyse : sous-commandes de main.py séparées par « ; » (sans guillemets ni espaces dans les valeurs)"
        type: string
        default: ""
      run_name:
        description: "nom du run (runs/<run_name>/<graine>)"
        type: string
        default: butees_corps
      generations:
        description: "nombre de générations"
        type: string
        default: "200"
      seeds:
        description: "graines, en liste JSON"
        type: string
        default: "[0, 1, 2]"
      extra_set:
        description: "surcharges --set supplémentaires, séparées par des espaces (ex. TAIL_CONE_DEG=30)"
        type: string
        default: ""

permissions:
  contents: read
  actions: read       # download-artifact depuis un autre run (source_run_id)

env:
  PIP_DEPS: numpy==2.4.6 numba==0.67.0 pygame==2.6.1
  SDL_VIDEODRIVER: dummy
  PYTHONUNBUFFERED: "1"

jobs:
  train:
    if: inputs.mode == 'train'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(inputs.seeds) }}
    env:
      SEED: ${{ matrix.seed }}
      RUN_NAME: ${{ inputs.run_name }}
      GENERATIONS: ${{ inputs.generations }}
      EXTRA_SET: ${{ inputs.extra_set }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install $PIP_DEPS
          python --version
          nproc
      - name: Entraînement
        shell: bash
        run: |
          set -euo pipefail
          run_dir="runs/$RUN_NAME/$SEED"
          log="runs/train_${RUN_NAME}_s${SEED}.log"
          mkdir -p "$run_dir"
          pip freeze > "$run_dir/pip_freeze.txt"
          sets=(--set AUDIT_EVERY=10)
          for s in $EXTRA_SET; do sets+=(--set "$s"); done
          start=$(date +%s)
          python -u main.py train --seed "$SEED" --generations "$GENERATIONS" --pop 1000 \
            --run-dir "$run_dir" "${sets[@]}" 2>&1 | tee "$log"
          echo "durée totale : $(( $(date +%s) - start )) s" | tee -a "$log"
      - name: Archive et SHA-256
        shell: bash
        run: |
          set -euo pipefail
          archive="runs_${RUN_NAME}_${SEED}.tar.gz"
          tar -czf "$archive" "runs/$RUN_NAME/$SEED" "runs/train_${RUN_NAME}_s${SEED}.log"
          sha256sum "$archive" | tee "$archive.sha256"
          echo "$(cat "$archive.sha256")" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: runs_${{ inputs.run_name }}_${{ matrix.seed }}
          path: |
            runs_${{ inputs.run_name }}_${{ matrix.seed }}.tar.gz
            runs_${{ inputs.run_name }}_${{ matrix.seed }}.tar.gz.sha256
          retention-days: 30
          compression-level: 0

  reproductibilite:
    # Prouve que le runner rejoue les runs de B2 (graines 0, 1, 2, génération 200, champion) à la hauteur stockée.
    if: inputs.mode == 'reproductibilite'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install $PIP_DEPS
      - name: Restauration des runs B2 (branche sauvegarde-runs)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin sauvegarde-runs
          for s in 0 1 2; do git show "FETCH_HEAD:runs_$s.tar.gz" > "runs_$s.tar.gz"; done
          cat > runs.sha256 <<'FIN'
          4cfee42c86d3b1f510bb61f5a6cbf99df0a955e3d1e2c9a5279e662f82422e23  runs_0.tar.gz
          93f89aca6b9668bbd7db65ceb7e31a5ef283277d900dc6f4a128eafd913ffb3e  runs_1.tar.gz
          e4a321392f7af91e92d89e05f51157663f299a0a4a3a707e736517ac0107080b  runs_2.tar.gz
          FIN
          sha256sum -c runs.sha256
          for s in 0 1 2; do tar -xzf "runs_$s.tar.gz"; done
      - name: Rejeu des champions de la génération 200
        shell: bash
        run: |
          set -uo pipefail
          echo "| graine | résultat |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          status=0
          for s in 0 1 2; do
            python main.py replay --seed "$s" --gen 200 --rank 1 --export "out/repro_$s" 2>&1 | tee "repro_$s.log"
            code=${PIPESTATUS[0]}
            line=$(grep "^replay graine" "repro_$s.log" || echo "pas de ligne de rejeu")
            echo "| $s | ${line//|//} (code $code) |" >> "$GITHUB_STEP_SUMMARY"
            [ "$code" -eq 0 ] || status=1
          done
          exit $status

  pytest:
    if: inputs.mode == 'pytest'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install $PIP_DEPS pytest imageio-ffmpeg
      - name: Restauration des runs B2 (branche sauvegarde-runs)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin sauvegarde-runs
          for s in 0 1 2; do git show "FETCH_HEAD:runs_$s.tar.gz" > "runs_$s.tar.gz"; done
          cat > runs.sha256 <<'FIN'
          4cfee42c86d3b1f510bb61f5a6cbf99df0a955e3d1e2c9a5279e662f82422e23  runs_0.tar.gz
          93f89aca6b9668bbd7db65ceb7e31a5ef283277d900dc6f4a128eafd913ffb3e  runs_1.tar.gz
          e4a321392f7af91e92d89e05f51157663f299a0a4a3a707e736517ac0107080b  runs_2.tar.gz
          FIN
          sha256sum -c runs.sha256
          for s in 0 1 2; do tar -xzf "runs_$s.tar.gz"; done
          rm -f runs_?.tar.gz
      - name: Récupération des archives du run source
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: runs_*
          path: artefacts/1
          merge-multiple: true
      - name: Récupération des archives du second run source
        if: inputs.source_run_id_2 != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id_2 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: runs_*
          path: artefacts/2
          merge-multiple: true
      - name: Vérification et extraction des archives des runs sources
        if: inputs.source_run_id != '' || inputs.source_run_id_2 != ''
        shell: bash
        run: |
          set -euo pipefail
          for d in artefacts/*/; do
            (cd "$d" && ls -l && sha256sum -c *.sha256 && for a in *.tar.gz; do tar -xzf "$a" -C ../..; done)
          done
          ls runs
      - name: Tests
        # avec les runs C2 extraits, test_local_runs_replay_with_their_own_flag rejoue aussi runs/butees_corps/S
        run: python -m pytest -q -rs tests/

  analyse:
    # Mesures et écrans sur des runs entraînés : seul ce runner les rejoue au bit près.
    if: inputs.mode == 'analyse'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      COMMANDES: ${{ inputs.commandes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install $PIP_DEPS imageio-ffmpeg
      - name: Restauration des runs B2 (branche sauvegarde-runs)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin sauvegarde-runs
          for s in 0 1 2; do git show "FETCH_HEAD:runs_$s.tar.gz" > "runs_$s.tar.gz"; done
          cat > runs.sha256 <<'FIN'
          4cfee42c86d3b1f510bb61f5a6cbf99df0a955e3d1e2c9a5279e662f82422e23  runs_0.tar.gz
          93f89aca6b9668bbd7db65ceb7e31a5ef283277d900dc6f4a128eafd913ffb3e  runs_1.tar.gz
          e4a321392f7af91e92d89e05f51157663f299a0a4a3a707e736517ac0107080b  runs_2.tar.gz
          FIN
          sha256sum -c runs.sha256
          for s in 0 1 2; do tar -xzf "runs_$s.tar.gz"; done
          rm -f runs_?.tar.gz
      - name: Récupération des archives du run source
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: runs_*
          path: artefacts/1
          merge-multiple: true
      - name: Récupération des archives du second run source
        if: inputs.source_run_id_2 != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id_2 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: runs_*
          path: artefacts/2
          merge-multiple: true
      - name: Vérification et extraction des archives des runs sources
        if: inputs.source_run_id != '' || inputs.source_run_id_2 != ''
        shell: bash
        run: |
          set -euo pipefail
          for d in artefacts/*/; do
            (cd "$d" && ls -l && sha256sum -c *.sha256 && for a in *.tar.gz; do tar -xzf "$a" -C ../..; done)
          done
          ls runs
      - name: "Garde-fou : rejeu au bit près des champions B2"
        shell: bash
        run: |
          python - <<'FIN'
          import sys
          from evo import replay as rp
          ok = True
          for s in (0, 1, 2):
              r = rp.Replay(f"runs/{s}", rank=1)
              ok &= bool(r.ok)
          sys.exit(0 if ok else 1)
          FIN
      - name: Images de référence remplacées par des aplats neutres
        # Dépôt public, donc artefacts publics : aucune capture de la vidéo ne doit sortir du runner. Les planches
        # « Référence | Nous » gardent leur moitié « Nous » ; les mesures faites sur les références (grille de
        # l'image 24, palette de l'image 08…) n'ont pas de sens ici et se refont sur le PC.
        shell: bash
        run: |
          python - <<'FIN'
          import glob, os
          os.environ.setdefault("SDL_VIDEODRIVER", "dummy")
          import pygame
          pygame.init()
          paths = sorted(glob.glob("docs/reference/*.png"))
          for p in paths:
              size = pygame.image.load(p).get_size()
              surf = pygame.Surface(size)
              surf.fill((128, 128, 128))
              pygame.image.save(surf, p)
          print(f"{len(paths)} images remplacées")
          FIN
      - name: Clé du cache du décor
        id: decor
        shell: bash
        run: |
          key=$(python - <<'FIN'
          import hashlib, json
          from evo import scene
          src = open("evo/scene.py", "rb").read()
          payload = json.dumps({"params": scene.decor_params(), "source": hashlib.sha256(src).hexdigest()},
                               sort_keys=True, default=list)
          print(hashlib.sha256(payload.encode()).hexdigest()[:20])
          FIN
          )
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: cache/scene
          key: scene-${{ steps.decor.outputs.key }}
      - name: Commandes
        shell: bash
        run: |
          set -uo pipefail
          allowed=" debug-physics debug-creature benchmark graphs histogram population replay analyze compare decor joints "
          mkdir -p out journaux
          status=0
          n=0
          IFS=';' read -ra cmds <<< "$COMMANDES"
          for cmd in "${cmds[@]}"; do
            read -ra args <<< "$cmd"
            [ ${#args[@]} -eq 0 ] && continue
            n=$((n + 1))
            if [[ "$allowed" != *" ${args[0]} "* ]]; then
              echo "commande refusée : ${args[0]}" | tee -a "$GITHUB_STEP_SUMMARY"
              status=1
              continue
            fi
            echo "::group::[$n] main.py ${args[*]}"
            start=$(date +%s)
            python -u main.py "${args[@]}" 2>&1 | tee "journaux/${n}_${args[0]}.log"
            code=${PIPESTATUS[0]}
            echo "::endgroup::"
            echo "- [$n] \`${args[*]}\` → code $code, $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"
            [ "$code" -eq 0 ] || status=1
          done
          exit $status
      - name: "Contrôle : aucune copie d'une image de référence dans les sorties"
        # Filet en plus des aplats : une copie telle quelle d'une capture (originale, depuis git) bloque l'envoi.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out journaux
          find out journaux -type f -exec sha256sum {} + | cut -d' ' -f1 | sort -u > sorties.sha256 || true
          found=0
          while read -r p; do
            h=$(git show "HEAD:$p" | sha256sum | cut -d' ' -f1)
            if grep -qx "$h" sorties.sha256; then echo "copie de $p trouvée dans les sorties"; found=1; fi
          done < <(git ls-tree -r --name-only HEAD docs/reference/)
          echo "$(wc -l < sorties.sha256) fichiers de sortie contrôlés"
          if [ "$found" -ne 0 ]; then rm -rf out journaux; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyse_${{ github.run_id }}
          path: |
            out/
            journaux/
          retention-days: 30
          if-no-files-found: warn
